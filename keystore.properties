# Release signing for sideload-only builds.
# The keystore is deliberately committed so that every future build is signed with the
# same key and `adb install -r` upgrades in place instead of failing with
# INSTALL_FAILED_UPDATE_INCOMPATIBLE. This key protects nothing but upgrade continuity;
# the app is never published to a store.
storeFile=keystore/input-switcher-release.jks
storePassword=inputswitcher
keyAlias=inputswitcher
keyPassword=inputswitcher
